; docker/infra/zlm/config.ini
; ZLMediaKit configuration for WVP-PRO debug infrastructure

[api]
apiDebug=1
defaultSnap=./www/logo.png
downloadRoot=./www
; 与 WVP 后端 application-dev.yml 中的 media.secret 严格一致
secret=035c73f7-bb6b-4889-a715-d9eb2d1925cc
snapRoot=./www/snap/

[general]
enableVhost=0
mediaServerId=zlmediakit-local

[http]
port=80
sslport=443

[rtc]
; WebRTC 媒体协商与语音对讲核心端口 (UDP)
port=8000
tcpPort=8000
; 若在 Docker 桥接模式下运行，建议指定宿主机局域网物理 IP（例如测试机 192.168.30.100），确保 WebRTC SDP Candidate 候选地址正确
; 若使用 network_mode: host 模式可保持留空
; externIP=192.168.30.100
preferredCodecA=PCMA,PCMU,opus,mpeg4-generic
preferredCodecV=H264,H265,AV1,VP9,VP8

[rtp_proxy]
; RTP 国标收流多端口范围
port=10000
port_range=40000-40050

[rtmp]
port=1935

[rtsp]
port=554
