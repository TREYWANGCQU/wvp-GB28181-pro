# docker/aio/conf/application-aio.yml
server:
  port: 18080

spring:
  application:
    name: wvp-pro-aio
  profiles:
    active: aio
  data:
    redis:
      # 闭环直连本容器内置 Redis
      host: 127.0.0.1
      port: 6379
      password: ""
      database: 0
  datasource:
    # 闭环直连本容器内置 MariaDB
    url: jdbc:mysql://127.0.0.1:3306/wvp?useUnicode=true&characterEncoding=UTF8&rewriteBatchedStatements=true&serverTimezone=Asia/Shanghai&useSSL=false&allowMultiQueries=true&allowPublicKeyRetrieval=true
    username: root
    password: ""
    driver-class-name: com.mysql.cj.jdbc.Driver

sip:
  # 容器暴露的 SIP 国标信令接入端口
  port: 8116
  # 若容器运行在 Bridge 模式下，推流摄像头需填写宿主机外部 IP；宿主机外部 IP 也可在启动时通过环境变量覆盖
  ip: 0.0.0.0
  id: 41010500002000000001
  domain: 4101050000
  password: admin

media:
  id: zlmediakit-aio
  # 容器内部闭环通信：WVP -> ZLM
  ip: 127.0.0.1
  http-port: 9092
  # 容器内部闭环通信：ZLM -> WVP (闭环通信规避宿主防火墙阻断)
  hook-ip: 127.0.0.1
  # [关键修正] 外部播放器拉流地址 IP（客户端浏览器拉流 IP）
  sdp-ip: 192.168.254.X
  # [关键修正] 外部播放器拉流地址 IP（客户端浏览器拉流 IP）
  stream-ip: 192.168.254.X
  secret: AzmbJcNEu3wJUPImx72ckPSxCzQ27HEX
  auto-config: true
  rtp:
    enable: true
    port-range: 30000,30500
    send-port-range: 30000,30500

logging:
  file:
    path: /opt/wvp/logs
  level:
    root: INFO
    com.genersoft.wvp: INFO
